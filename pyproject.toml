[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wayfinder"
version = "0.1.0"
description = "Universal doubt layer for every AI action — fast, calibrated, multilingual decisions over HTTP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "laya[serve]>=0.3.11",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
mcp = ["mcp>=2.2.0"]
redis = ["redis>=5.0.0"]
test = ["pytest>=8.0", "httpx>=0.27.0"]

[project.scripts]
wayfinder-mcp = "wayfinder.mcp_server:main"

[tool.setuptools]
packages = ["wayfinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
