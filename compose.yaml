services:
  wayfinder:
    build: .
    ports:
      - "${WAYFINDER_PORT:-8000}:8000"
    environment:
      WAYFINDER_HOST: "0.0.0.0"
      LAYA_DEVICE: "${LAYA_DEVICE:-cpu}"
      WAYFINDER_PRELOAD: "${WAYFINDER_PRELOAD:-1}"
      LAYA_MODELS: "${LAYA_MODELS:-english,multilingual}"
      LAYA_THREADS: "${LAYA_THREADS:-4}"
      WAYFINDER_API_KEY: "${WAYFINDER_API_KEY:-}"
      WAYFINDER_REDIS_URL: "${WAYFINDER_REDIS_URL:-redis://redis:6379/0}"
      DATABASE_URL: "${DATABASE_URL:-sqlite:///./data/wayfinder.db}"
      SUPERTOKENS_ENABLED: "${SUPERTOKENS_ENABLED:-0}"
      SUPERTOKENS_CONNECTION_URI: "${SUPERTOKENS_CONNECTION_URI:-http://localhost:3568}"
      SUPERTOKENS_API_KEY: "${SUPERTOKENS_API_KEY:-}"
      SUPERTOKENS_API_DOMAIN: "${SUPERTOKENS_API_DOMAIN:-http://127.0.0.1:8000}"
      SUPERTOKENS_WEBSITE_DOMAIN: "${SUPERTOKENS_WEBSITE_DOMAIN:-http://localhost:3000}"
      WAYFINDER_SUPERADMINS: "${WAYFINDER_SUPERADMINS:-}"
      WAYFINDER_RATE_FREE_PER_MIN: "${WAYFINDER_RATE_FREE_PER_MIN:-60}"
      WAYFINDER_RATE_PRO_PER_MIN: "${WAYFINDER_RATE_PRO_PER_MIN:-600}"
      WAYFINDER_RATE_IP_PER_MIN: "${WAYFINDER_RATE_IP_PER_MIN:-120}"
      WAYFINDER_QUOTA_FREE: "${WAYFINDER_QUOTA_FREE:-10000}"
      WAYFINDER_QUOTA_PRO: "${WAYFINDER_QUOTA_PRO:-500000}"
    depends_on:
      - redis
    volumes:
      - model-cache:/root/.cache/huggingface
      - app-data:/app/data
    init: true
    deploy:
      resources:
        limits:
          cpus: "4"

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

  # Optional Postgres for production. Compose sets DATABASE_URL to it when
  # you uncomment; local dev stays on the SQLite file in app-data.
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: wayfinder
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data

  web:
    build:
      context: ./web
      args:
        WAYFINDER_API_URL: "${WAYFINDER_API_URL:-http://wayfinder:8000}"
        NEXT_PUBLIC_WEBSITE_DOMAIN: "${NEXT_PUBLIC_WEBSITE_DOMAIN:-http://localhost:3000}"
        NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}"
        NEXT_PUBLIC_AUTH_DISABLED: "${NEXT_PUBLIC_AUTH_DISABLED:-}"
        NEXT_PUBLIC_OAUTH_PROVIDERS: "${NEXT_PUBLIC_OAUTH_PROVIDERS:-}"
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      WAYFINDER_API_URL: "http://wayfinder:8000"
      NEXT_PUBLIC_WEBSITE_DOMAIN: "${NEXT_PUBLIC_WEBSITE_DOMAIN:-http://localhost:3000}"
      NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}"
    depends_on:
      - wayfinder
    init: true

volumes:
  model-cache:
  redis-data:
  app-data:
  # pg-data:
